<div class="component-tabs">
	<nav class="navbar navbar-collapse-absolute navbar-expand-md navbar-underline navigation-bar navigation-bar-light">
		<div class="container-fluid container-fluid-max-xl">
			<a
				aria-controls="navigationBarCollapse"
				aria-expanded="false" *
				aria-label="Toggle Navigation"
				class="collapsed navbar-toggler navbar-toggler-link"
				data-toggle="collapse"
				href="#navigationBarCollapse"
				role="button"
			>
				<span class="navbar-text-truncate">Tab 1</span>
				<span class="icon-caret-bottom"></span>
			</a>
			<div
				class="collapse navbar-collapse"
				id="navigationBarCollapse"
				style="z-index: 1;"
			>
				<div class="container-fluid container-fluid-max-xl">
					<ul class="navbar-nav">
						[#list 0..configuration.numberOfTabs-1 as i]
						<li class="nav-item">
							<a class="nav-link" id="" href="#${i+1}-tab-content">
								<span class="navbar-text-truncate">
									<lfr-editable id="${i+1}-title" type="rich-text">
										Tab ${i+1}
									</lfr-editable>
								</span>
							</a>
						</li>
						[/#list]
					</ul>
				</div>
			</div>
		</div>
	</nav>
	<div class="tab-content">
		[#list 0..configuration.numberOfTabs-1 as i]
		<div id="${i+1}-tab-content" class="tab-content-item d-none">
			<lfr-editable id="${i+1}-drop-zone" type="rich-text">
				DROP ZONE ${i+1}
			</lfr-editable>
			<!-- <lfr-drop-zone id="${i}-tab-drop-zone" /> -->
		</div>
		[/#list]
	</div>
</div>
